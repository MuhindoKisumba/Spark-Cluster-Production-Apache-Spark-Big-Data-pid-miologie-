version: '3.9'

services:

  spark-master:
    image: bitnami/spark:latest
    container_name: spark_master
    hostname: spark-master

    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no

    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker-1:
    image: bitnami/spark:latest
    container_name: spark_worker_1

    depends_on:
      - spark-master

    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077

  spark-worker-2:
    image: bitnami/spark:latest
    container_name: spark_worker_2

    depends_on:
      - spark-master

    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077

  spark-history:
    image: bitnami/spark:latest
    container_name: spark_history

    command: >
      /opt/bitnami/spark/sbin/start-history-server.sh

    ports:
      - "18080:18080"